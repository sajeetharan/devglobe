name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'scripts/verify-docs-build.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'scripts/verify-docs-build.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.14.1

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run docs:build

      - name: Verify hosted agent resources
        run: npm run docs:check-live
        env:
          LIVE_SITE_URL: https://devglobe-web.victoriousground-cbcea081.eastus.azurecontainerapps.io

      - name: Run application tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4